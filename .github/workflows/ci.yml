name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Unit tests
        run: pytest -q
      - name: Run full pipeline
        run: python -m prp.run --config config.yaml
      - name: Check results match the committed ones
        run: git diff --exit-code -- results/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
